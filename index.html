<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FraudCanvas AI</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f9; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; }
        #canvas { height: 700px; width: 100%; background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; }
        .alert-card { padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid; font-size: 13px; }
        .alert-red { background: #fff5f5; border-color: #ff453a; }
        .alert-purple { background: #f3e5f5; border-color: #af52de; }
        .alert-orange { background: #fffaf0; border-color: #ff9f0a; }
        .legend { background: #fff; padding: 10px 25px; border-radius: 50px; display: inline-flex; gap: 15px; font-size: 12px; margin-top: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body class="p-4">
    <div class="d-flex justify-content-between mb-4 bg-white p-3 rounded shadow-sm">
        <h4 class="m-0 fw-bold">🛡️ FRAUDCANVAS</h4>
        <div class="d-flex gap-2">
            <input id="search-id" class="form-control" placeholder="Search ID (S01, C04...)" style="width: 300px;">
            <button class="btn btn-primary fw-bold" onclick="loadData()">ANALYZE</button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="sidebar mb-4">
                <h6 class="fw-bold small">DATA INJECTION</h6>
                <input id="sid" class="form-control form-control-sm mb-2" placeholder="Store ID">
                <input id="oid" class="form-control form-control-sm mb-2" placeholder="Owner ID">
                <button class="btn btn-dark w-100 btn-sm" onclick="addStore()">SYNC</button>
            </div>
            <div class="sidebar overflow-auto" style="max-height: 450px;">
                <h6 class="fw-bold small mb-3">FRAUD ALERTS</h6>
                <div id="alert-list"></div>
            </div>
        </div>
        <div class="col-md-9 text-center">
            <div id="canvas"></div>
            <div class="legend shadow-sm">
                <span><b style="color: #ff453a;">●</b> Cycle Fraud</span>
                <span><b style="color: #af52de;">●</b> Self-Buying</span>
                <span><b style="color: #ff9f0a;">●</b> Community</span>
                <span><b style="color: #0a84ff;">●</b> Customer</span>
                <span><b style="color: #32d74b;">●</b> Store</span>
            </div>
        </div>
    </div>

    <script>
        let network = null;
        async function loadData() {
            const sid = document.getElementById('search-id').value;
            const res = await fetch(sid ? `http://127.0.0.1:8000/api/graph?search_id=${sid}` : 'http://127.0.0.1:8000/api/graph');
            const data = await res.json();
            const nodes = new vis.DataSet(data.nodes.map(n => ({...n, shape: 'dot', size: 25})));
            const edges = new vis.DataSet(data.edges.map(e => ({...e, arrows: 'to', color: '#e2e8f0'})));
            if(network) network.destroy();
            network = new vis.Network(document.getElementById('canvas'), {nodes, edges}, { physics: { stabilization: true, barnesHut: { gravitationalConstant: -2000 } } });

            document.getElementById('alert-list').innerHTML = data.nodes.filter(n => n.status !== "Normal").map(n => `
                <div class="alert-card ${n.status === 'Circular Fraud' ? 'alert-red' : (n.status === 'Self-Buying' ? 'alert-purple' : 'alert-orange')}">
                    <div class="fw-bold">${n.orig_id}</div><div class="small">${n.status}</div>
                </div>`).join('');
        }
        window.onload = loadData;
    </script>
</body>
</html>
